[package]
name = "pdf-tree"
version = "0.1.0"
edition = "2024"

[dependencies]
rune = { path = "../rune/crates/rune", features = ["native-file-dialog"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
